# AAHP Verify - the intended REQUIRED status check for the handoff gate.
#
# Runs the AAHP CLI `aahp verify --level ci`, which executes all 4 layers with
# NO escape hatch (AAHP_SKIP_VERIFY is ignored at --level ci). This is the
# off-machine, non-bypassable backstop behind the local pre-commit / pre-push
# hooks:
#   Layer 1: MANIFEST checksum integrity
#   Layer 2: content-drift gate (code changed => STATUS.md + MANIFEST.json must change)
#   Layer 3: commit-pointer freshness
#   Layer 4: TRUST-TTL expiry (advisory)
# It then runs `aahp doctor --json` to record the 6-gate conformance snapshot.
#
# The CLI (@elvatis_com/aahp, pinned to 3.8.0 below) is the authoritative
# conformance checker. The vendored bash gate scripts under scripts/ remain the
# canonical fleet source that this repo distributes to consumer repos (see
# scripts/sync-gate-scripts.sh and .github/workflows/gate-sync.yml) and back the
# local pre-commit / pre-push hooks; CI verifies against the CLI so this repo is
# held to the same standard it ships.
#
# Dependabot exemption: a pure dependency bump introduces no handoff-state change,
# so the AAHP handoff gate does not apply to it. The job stays a REQUIRED check but
# no-ops to success when the change originates from dependabot[bot] - on both the PR
# (github.actor) and the resulting push to main (head_commit.author). Security and
# build remain gated by the supply-chain-guard and CodeQL checks, which still run.
#
# NOTE: This workflow runs on pull requests and pushes to main. To fully close
# the gate, mark this job as a REQUIRED status check in branch protection so it
# cannot be bypassed by skipping the local pre-commit / pre-push hooks.

name: AAHP Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  aahp-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Dependabot exemption (handoff gate not applicable)
        if: ${{ github.actor == 'dependabot[bot]' || github.event.head_commit.author.username == 'dependabot[bot]' }}
        run: |
          echo "Dependabot change detected: the AAHP handoff gate does not apply."
          echo "A pure dependency bump introduces no handoff-state change."
          echo "Security and build remain gated by the supply-chain-guard and CodeQL checks."

      - name: Checkout code
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        uses: actions/checkout@v4
        with:
          # Full history so the content-drift gate can diff against the base.
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run aahp verify (CI level, no escape hatch)
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        run: npx -y @elvatis_com/aahp@3.8.0 verify . --level ci

      - name: Record aahp doctor conformance snapshot
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        run: npx -y @elvatis_com/aahp@3.8.0 doctor . --json
