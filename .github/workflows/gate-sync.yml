# Gate Script Sync - propagate the canonical AAHP gate scripts to every consumer.
#
# WHY
#   The four gate scripts (scripts/_aahp-lib.sh, lint-handoff.sh,
#   aahp-manifest.sh, verify-handoff.sh) are vendored (copied) into every
#   consumer repo. A fix that lands here never reaches those copies on its own,
#   so the fleet DRIFTS. This workflow closes the loop: when any of the four
#   canonical scripts changes on main, it syncs the change into each consumer
#   (preserving that repo's per-repo AAHP_HANDOFF_FILES config) and OPENS a PR.
#   It never merges - a human reviews and merges each consumer PR.
#
# TRIGGER
#   - push to main that touches one of the four gate scripts
#   - manual (workflow_dispatch)
#
# CONSUMER LIST (required configuration)
#   This repository ships the MECHANISM; the list of repositories it targets is
#   deployment configuration and is read at runtime from the Actions variable
#   GATE_SYNC_CONSUMERS. Format: `owner/name` entries separated by newlines,
#   commas, or spaces; blank lines and `# comment` tails are ignored. Example:
#
#     acme/example-app
#     acme/example-service
#
#   Set it under Settings -> Secrets and variables -> Actions -> Variables
#   (repository or organization scope). Variables are not published with the
#   source, so the list is maintained without being part of the public tree.
#   Entries are registered with ::add-mask:: before use, so the run log reports
#   progress by position ("consumer 3/12") rather than by name.
#
#   Fallback for forks and outside adopters: run the workflow manually and pass
#   the list in the `consumers` input. Note that workflow_dispatch inputs are
#   recorded in the run metadata, so prefer the variable when the list should
#   not be part of a public run record.
#
#   With neither configured the job exits successfully after a warning: no
#   configuration, nothing to sync.
#
# RUNNER
#   Defaults to GitHub-hosted ubuntu-latest, matching
#   .github/workflows/aahp-verify.yml. An operator who runs this on their own
#   infrastructure sets the Actions variable GATE_SYNC_RUNNER to their runner
#   label (a runner group or one distinguishing label) instead of editing this
#   file.
#
# TOKEN / SECRET (required)
#   The default GITHUB_TOKEN is scoped to THIS repo only and cannot push
#   branches or open pull requests in the OTHER (consumer) repos. This workflow
#   therefore needs a cross-repo token provided as the secret GATE_SYNC_TOKEN:
#     - Classic PAT with the `repo` scope, owned by a user (or a machine/bot
#       account) that has write access to every configured consumer repo; OR
#     - A fine-grained PAT granting Contents: read/write and Pull requests:
#       read/write on each consumer repo.
#   Store it as an Actions secret named GATE_SYNC_TOKEN in this repository
#   (Settings -> Secrets and variables -> Actions). Without it the job exits
#   early with a clear message.

name: Gate Script Sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/_aahp-lib.sh'
      - 'scripts/lint-handoff.sh'
      - 'scripts/aahp-manifest.sh'
      - 'scripts/verify-handoff.sh'
  workflow_dispatch:
    inputs:
      consumers:
        description: 'One-off consumer list (owner/name, comma or newline separated). Overrides the GATE_SYNC_CONSUMERS variable for this run. Recorded in the run metadata.'
        required: false
        type: string

# Only the checkout of THIS repo needs the default token (read is enough);
# all cross-repo writes go through GATE_SYNC_TOKEN.
permissions:
  contents: read

concurrency:
  group: gate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ${{ vars.GATE_SYNC_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout canonical (homeofe/improvements)
        uses: actions/checkout@v4

      - name: Sync gate scripts into every consumer and open PRs
        env:
          # Cross-repo token. GH_TOKEN is what `gh pr create` reads; the same
          # value is embedded in the clone/push URLs for git.
          GATE_SYNC_TOKEN: ${{ secrets.GATE_SYNC_TOKEN }}
          GH_TOKEN: ${{ secrets.GATE_SYNC_TOKEN }}
          # Target list: the manual input wins for a one-off run, otherwise the
          # configured variable. Never hardcoded in this file. github.event.inputs
          # is used rather than the inputs context because it resolves to null on
          # the push trigger instead of depending on context availability.
          GATE_SYNC_CONSUMERS: ${{ github.event.inputs.consumers || vars.GATE_SYNC_CONSUMERS }}
        run: |
          set -euo pipefail

          if [ -z "${GATE_SYNC_TOKEN:-}" ]; then
            echo "::warning::GATE_SYNC_TOKEN secret is not set - skipping the gate sync."
            echo "::warning::To activate fleet propagation, add an Actions secret named"
            echo "::warning::GATE_SYNC_TOKEN (a cross-repo PAT with repo scope, or fine-grained"
            echo "::warning::Contents+PRs read/write on each consumer), then re-run this workflow."
            echo "::warning::The default GITHUB_TOKEN cannot open PRs in other repositories."
            echo "gate sync skipped: no GATE_SYNC_TOKEN configured yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CANON="$PWD"

          # --- Consumer list from configuration ---------------------------
          # Read from GATE_SYNC_CONSUMERS (Actions variable, or the manual
          # input). Accepts newline-, comma-, or space-separated `owner/name`
          # entries and ignores blank lines and `#` comment tails. A repo whose
          # scripts/_aahp-lib.sh is missing (404 / moved) is skipped at runtime
          # by the guard below, so the list stays declarative.
          CONSUMERS=()
          malformed=0
          set -f   # no globbing while the list is word-split below
          while IFS= read -r line; do
            line="${line%%#*}"            # drop a comment tail, per line
            line="${line//$'\r'/}"        # tolerate CRLF values
            line="${line//,/ }"           # commas are separators too
            for entry in $line; do        # deliberate word splitting on spaces/tabs
              if printf '%s' "$entry" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'; then
                CONSUMERS+=("$entry")
              else
                malformed=$((malformed + 1))
              fi
            done
          done <<< "${GATE_SYNC_CONSUMERS:-}"
          set +f

          if [ "$malformed" -gt 0 ]; then
            # The entry itself is not echoed: a typo carries the same content as
            # a valid entry, and this log is as public as the repository.
            echo "::warning::$malformed entry/entries in GATE_SYNC_CONSUMERS are not of the form owner/name and were ignored."
          fi

          if [ "${#CONSUMERS[@]}" -eq 0 ]; then
            echo "::warning::No consumers configured - nothing to sync."
            echo "::warning::Set the Actions variable GATE_SYNC_CONSUMERS to a list of"
            echo "::warning::owner/name repositories (newline, comma, or space separated),"
            echo "::warning::or pass the 'consumers' input when running this workflow manually."
            echo "gate sync skipped: GATE_SYNC_CONSUMERS is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Register every target as a masked value so no later log line (git
          # output, gh output, an error message) can print a target name.
          for repo in "${CONSUMERS[@]}"; do
            echo "::add-mask::$repo"
          done

          TOTAL="${#CONSUMERS[@]}"
          echo "Configured consumers: $TOTAL (reported below by position in GATE_SYNC_CONSUMERS)."

          BRANCH="chore/aahp-gate-sync"
          PR_TITLE="chore(aahp): sync gate scripts from homeofe/improvements"
          TODAY="$(date -u +%Y-%m-%d)"

          opened=0
          uptodate=0
          skipped=0
          idx=0

          for repo in "${CONSUMERS[@]}"; do
            idx=$((idx + 1))
            label="consumer $idx/$TOTAL"
            echo "::group::$label"
            work="$(mktemp -d)"
            url="https://x-access-token:${GATE_SYNC_TOKEN}@github.com/${repo}.git"

            if ! git clone --depth 1 "$url" "$work" >/dev/null 2>&1; then
              echo "skip: cannot clone $label (missing access or repo)."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            # Path guard: only sync repos that actually vendor the gate lib.
            if [ ! -f "$work/scripts/_aahp-lib.sh" ]; then
              echo "skip: $label has no scripts/_aahp-lib.sh (path moved or not a consumer)."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            # --- 1. Config-aware sync (preserves AAHP_HANDOFF_FILES) -------
            # A non-zero exit (e.g. exit 2 = the consumer's AAHP_HANDOFF_FILES
            # line is unparseable) skips THIS consumer with a warning; it must
            # not abort the whole fleet, so it is guarded (set -e would kill the
            # loop otherwise).
            if ! bash "$CANON/scripts/sync-gate-scripts.sh" "$work"; then
              echo "::warning::sync-gate-scripts.sh failed for $label (e.g. unparseable AAHP_HANDOFF_FILES); skipping."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            if git -C "$work" diff --quiet; then
              echo "$label already in sync; nothing to do."
              uptodate=$((uptodate + 1)); echo "::endgroup::"; continue
            fi

            changed_scripts="$(git -C "$work" diff --name-only -- scripts/ | sed 's/^/- /')"

            # --- 2. Handoff refresh so the PR passes the consumer's own gate.
            # The consumers are AAHP-gated: a change to source (scripts/*) must
            # ship with a STATUS.md update AND a regenerated MANIFEST.json, or
            # their aahp-verify content-drift gate (Layer 2) fails. Refresh both
            # when the consumer is gated. AAHP_HANDOFF_FILES was preserved above,
            # so the regenerated manifest indexes exactly the repo's own files.
            if [ -f "$work/scripts/verify-handoff.sh" ] && [ -f "$work/.ai/handoff/STATUS.md" ]; then
              note="> Note (${TODAY}, gate-sync): synced AAHP gate scripts from homeofe/improvements; AAHP_HANDOFF_FILES preserved."
              tmp="$(mktemp)"
              { printf '%s\n\n' "$note"; cat "$work/.ai/handoff/STATUS.md"; } > "$tmp"
              mv "$tmp" "$work/.ai/handoff/STATUS.md"
              # If the manifest regen FAILS, mark this consumer skipped and do
              # NOT open a half-refreshed PR (the old '|| true' swallowed this and
              # would push a PR whose MANIFEST.json did not match STATUS.md,
              # failing the consumer's own Layer-1 gate). Guarded so the failure
              # skips this consumer instead of aborting the fleet.
              if ! bash "$work/scripts/aahp-manifest.sh" "$work" \
                  --agent gate-sync-bot --phase fix --quiet; then
                echo "::warning::manifest regen failed for $label; not opening a half-refreshed PR."
                skipped=$((skipped + 1)); echo "::endgroup::"; continue
              fi
            fi

            # --- 3. Commit on a dedicated branch --------------------------
            # Commit as the standard Actions bot identity: this runs unattended
            # and the authorship belongs to the automation, not to a person.
            git -C "$work" config user.name  "github-actions[bot]"
            git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C "$work" checkout -B "$BRANCH" >/dev/null 2>&1; then
              echo "::warning::could not create branch $BRANCH in $label; skipping."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi
            git -C "$work" add -A scripts/ .ai/handoff/STATUS.md .ai/handoff/MANIFEST.json 2>/dev/null || true
            git -C "$work" commit -q -m "$PR_TITLE" || {
              echo "nothing staged for $label (unexpected); skipping."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            }

            # Force-update the dedicated bot branch (safe: it is owned by this job).
            # A failed push must skip this consumer, not abort the fleet.
            if ! git -C "$work" push --force "$url" "HEAD:refs/heads/$BRANCH" >/dev/null 2>&1; then
              echo "::warning::push failed for $label (branch not updated); skipping."
              skipped=$((skipped + 1)); echo "::endgroup::"; continue
            fi

            # --- 4. Open a PR if one is not already open ------------------
            existing="$(gh pr list --repo "$repo" --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo 0)"
            if [ "$existing" != "0" ]; then
              echo "PR already open for $label ($BRANCH); the push updated it."
              opened=$((opened + 1)); echo "::endgroup::"; continue
            fi

            body="$(cat <<EOF
          ## Automated gate-script sync

          The canonical AAHP gate scripts changed in
          [homeofe/improvements](https://github.com/homeofe/improvements). This PR
          vendors the update into this repo so the gate does not drift.

          ### Scripts updated
          $changed_scripts

          ### Per-repo config preserved
          This repo's \`AAHP_HANDOFF_FILES=(...)\` line in
          \`scripts/_aahp-lib.sh\` was read from the existing file and substituted
          back into the canonical copy, so the set of handoff files this repo
          tracks is unchanged. The gate-deciding \`aahp_checksum\` function is
          byte-identical to canonical.

          ### Handoff state
          \`STATUS.md\` carries a sync note and \`MANIFEST.json\` was regenerated
          so this PR satisfies this repo's own AAHP content-drift gate.

          ### How this was produced
          Generated by \`.github/workflows/gate-sync.yml\` in homeofe/improvements
          via \`scripts/sync-gate-scripts.sh\`, authenticated with the
          \`GATE_SYNC_TOKEN\` secret (cross-repo PAT, repo scope). The workflow
          opens this PR and never merges it - review and merge as usual.
          EOF
          )"

            if gh pr create --repo "$repo" --head "$BRANCH" --base main \
                 --title "$PR_TITLE" --body "$body" >/dev/null 2>&1; then
              echo "opened PR for $label."
              opened=$((opened + 1))
            else
              echo "::warning::could not open PR for $label (branch pushed; open manually)."
              skipped=$((skipped + 1))
            fi
            echo "::endgroup::"
          done

          echo "Summary: consumers=$TOTAL, opened/updated=$opened, already-in-sync=$uptodate, skipped=$skipped"
